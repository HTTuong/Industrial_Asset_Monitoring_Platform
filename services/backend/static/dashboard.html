<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Industrial Asset Monitoring — Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #f5f5f5; }
    h1 { font-size: 1.3rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; background: white; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; font-size: 0.9rem; }
    th { background: #333; color: white; }
    .status-active { color: green; font-weight: bold; }
    .status-offline { color: #999; }
    .status-inactive { color: orange; }
    .alert-row { background: #fff3f3; }
  </style>
</head>
<body>
  <h1>Devices</h1>
  <table id="devices-table">
    <thead><tr><th>Device ID</th><th>Name</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>

  <h1>Active Alerts</h1>
  <table id="alerts-table">
    <thead><tr><th>Device ID</th><th>Type</th><th>Message</th><th>Created</th></tr></thead>
    <tbody></tbody>
  </table>

  <script src="dashboard.js"></script>
</body>
</html>
